[project]
name = "dinov3lora"
version = "0.1.0"
description = "DINOv3 distillation with LoRA"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- Core DL ---
    "torch==2.10.0",
    "torchvision",
    # --- Training infra ---
    "pytorch-lightning>=2.2.0",
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "transformers>=4.57.0",
    "diffusers>=0.36.0",
    "peft>=0.18.1",
    # --- Config / utils ---
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "tqdm>=4.67.1",
    # --- Scientific stack ---
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    # --- Visualization / debug ---
    "matplotlib>=3.8",
    "seaborn>=0.13.2",
    "opencv-python>=4.9",
    # --- Models ---
    "timm>=1.0.22",
    # --- Experiment tracking ---
    "wandb>=0.16.0",
    # --- Dev / quality ---
    "ipython",
    "pre-commit",
    "tensorboardx>=2.6.4",
]

# ------------------------------
# PyTorch CUDA 12 wheel index
# ------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# ------------------------------
# Ruff
# ------------------------------
[tool.ruff]
line-length = 150
select = ["F", "E", "W", "UP"]
ignore = ["F401", "E402", "F541", "UP006", "UP035", "I001", "I002"]

# ------------------------------
# setuptools
# ------------------------------
[tool.setuptools]
packages = ["t4"]
