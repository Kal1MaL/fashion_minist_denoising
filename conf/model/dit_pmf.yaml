_target_: src.lightning_module.LitPixelMeanFlow
in_channels: 3              # 输入通道: z_t, y_blur, y_flip
img_size: 28
patch_size: 2
hidden_dim: 256
depth: 12
num_heads: 8
num_classes: 10
num_time_tokens: 4          # pMF 的 4 个时间顾问
num_cls_tokens: 4           # 4 个全局类别寄存器
learning_rate: 1e-3
lambda_pmf: 1.0             # 流匹配 v-loss 权重
lambda_mse: 5.0             # 竞赛核心！MSE 重建约束权重