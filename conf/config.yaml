defaults:
  - _self_
  - model: dit_pmf
  - data: fashion_mnist   # 对应我们上一轮写的 DataModule

trainer:
  max_epochs: 160
  accelerator: "gpu"
  devices: 2
  precision: "bf16-mixed" # 开启混合精度加速
  gradient_clip_val: 1.0     # <--- 加上这一行！限制全局梯度范数最大为 1
  gradient_clip_algorithm: "norm"

experiment_name: "pmf_dit_rope_hybrid_data2data"

# legacy version cfgs below
data:
  train_path: "data/fashion-mnist_noisy_train.csv"
  clean_path: "data/fashion-mnist_clean_train.csv"
  test_path: "data/fashion-mnist_noisy_test.csv"
  val_split: 0.1

training:
  batch_size: 64
  lr: 0.001
  epochs: 150
  accelerator: "auto"
  devices: "auto"

model:
  # 可选值: "ours" (你的双头+课程学习) all | "baseline" (普通DDPM) | 'sigma' baseline + sigma conditioning
  mode: "ours"
  timesteps: 1000
  channels: 64
  dim_mults: [1, 2, 4]